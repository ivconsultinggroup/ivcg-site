<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming soon — Innovation Vision Consulting Group</title>
  <meta name="description" content="Innovation Vision Consulting Group — this page is coming soon.">
  <link rel="icon" href="assets/icon.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="assets/icon-32.png?v=3" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Tinos:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1d4355;
      --cyan: #0cc0df;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--navy);
      background: var(--white) url("assets/waves.webp") center / cover no-repeat;
    }
    a { color: inherit; text-decoration: none; }
    .header { padding: 56px 5.5vw 0; }
    .logo img { display: block; width: clamp(226px, 24.7vw, 350px); height: auto; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 5.5vw 18vh;
    }
    h1 {
      font-weight: 800;
      font-size: clamp(2.6rem, 6.5vw, 7rem);
      line-height: 1.1;
      letter-spacing: .06em;
    }
    h1 span { color: var(--cyan); }
    .lead {
      font-family: "Tinos", "Liberation Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.1rem, 1.55vw, 1.6rem);
      line-height: 1.55;
      max-width: 30em;
      margin: 40px 0 48px 4px;
    }
    .buttons { display: flex; flex-wrap: wrap; gap: 24px 40px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      font-weight: 800;
      font-size: clamp(.85rem, 1.1vw, 1.05rem);
      letter-spacing: .2em;
      padding: 20px 38px;
      border-radius: 999px;
      border: 2.5px solid var(--cyan);
      transition: transform .2s, background .2s, color .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn--solid { background: var(--cyan); color: var(--white); }
    .btn--solid:hover { background: #09a8c4; border-color: #09a8c4; }
    .btn--outline { background: rgba(255,255,255,.3); color: var(--navy); }
    .btn--outline:hover { background: var(--cyan); color: var(--white); }
    .btn svg { width: 40px; height: 14px; }
    @media (max-width: 520px) {
      .header { padding-top: 24px; }
      .logo img { width: 206px; }
      h1 { letter-spacing: .03em; }
      .btn { width: 100%; justify-content: center; padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="logo" href="/"><img src="assets/logo.svg" alt="Innovation Vision Consulting Group" width="340" height="85"></a>
  </header>
  <main>
    <h1>Coming <span>soon.</span></h1>
    <p class="lead">We're putting the finishing touches on this page. In the meantime, we'd love to hear from you.</p>
    <div class="buttons">
      <a class="btn btn--solid" href="/">
        <svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M40 7H2M8 1L2 7l6 6"/></svg>
        BACK TO HOME
      </a>
      <a class="btn btn--outline" href="mailto:contact@ivconsultinggroup.com">CONTACT US</a>
    </div>
  </main>
</body>
</html>
